# Whole-app deployment per docs/11-deployment.md — start/stop everything
# as one unit: `docker compose up -d` / `docker compose down`. Ollama is
# deliberately NOT a service here — it's already running separately on
# devin-server; see the ai-service section below for how that's reached.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: data_cleanup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs `prisma migrate deploy` once and exits — a standard Compose
  # pattern for applying migrations before the app starts, kept separate
  # from `web` so the runtime image doesn't need to carry the full Prisma
  # CLI + devDependencies (see apps/web/Dockerfile's `builder` stage).
  migrator:
    build:
      context: ./apps/web
      target: builder
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/data_cleanup
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    # Runs as the deploying host user's own uid/gid rather than root — a
    # real bug found and fixed while testing Phase 2's file upload: files
    # written by a root container into the bind-mounted ./storage came out
    # root-owned, un-deletable by the host user without sudo, defeating
    # the "directly inspectable/backuppable from host" point of using a
    # bind mount at all (docs/11-deployment.md). Same fix pattern already
    # proven in spikes/docker-sandbox. Defaults to 1000:1000 (the common
    # first-non-root-user uid/gid); override APP_UID/APP_GID in .env if
    # the deploying user differs — see .env.example.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/data_cleanup
      AUTH_SECRET: ${AUTH_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_ROOT: /app/storage
      SCRAPERS_ROOT: /app/scrapers
      # docker-compose.yml's ${VAR} interpolation reads .env for values
      # used INSIDE this file, but doesn't automatically forward them into
      # a container's own process environment — found the hard way running
      # `docker compose exec web ... prisma/seed.ts` for a real deployment
      # and seeing it report these as unset despite being in .env. Explicit
      # passthrough needed for prisma/seed.ts (run manually, docs/11-deployment.md)
      # to actually see them.
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      # The client-side WS URL (app/present/[sessionId]/page.tsx,
      # app/control/[sessionId]/page.tsx) needs the HOST-published port,
      # not the container-internal one (ws-server.ts always binds 3001
      # inside its own container regardless of what host port it's mapped
      # to) — passed through so the page can embed the right port per
      # deployment instead of a value baked in at image-build time.
      WEB_WS_PORT: ${WEB_WS_PORT:-3001}
    ports:
      # Host-side ports are configurable (WEB_PORT/WEB_WS_PORT in .env,
      # default 3000/3001) — a shared host running other Docker Compose
      # stacks can easily already have 3000/3001 taken (found this for
      # real deploying alongside an existing stack: 3000 was taken by one
      # service, 3001 by another). The container-side ports stay fixed
      # (3000 is what Next.js listens on, 3001 is ws-server.ts's default
      # WS_PORT) — only the host-facing mapping needs to move.
      - "${WEB_PORT:-3000}:3000"
      # WS control server (docs/08-raspberry-pi-controller.md) — same
      # container as the Next app on purpose, see apps/web/ws-server.ts's
      # header comment; published here the same way WEB_PORT is so a Pi
      # controller or host browser can reach it at the same hostname.
      - "${WEB_WS_PORT:-3001}:3001"
    volumes:
      - ./storage:/app/storage
      # Real scraper installs (docs/03-ingestion-and-scrapers.md). Read-write
      # since `web` now also extracts uploaded scraper .zips here
      # (lib/scrapers-fs.ts's extractScraperZip) — no longer read-only as
      # it was through Phase 5, when `web` only ever browsed READMEs.
      # `web` still never *executes* a scraper or reads its credentials;
      # that stays ai-service's job over in the sandbox executor.
      - ./example-scrapers:/app/scrapers
    depends_on:
      migrator:
        condition: service_completed_successfully

  ai-service:
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # The Docker socket below is owned root:docker on the host with mode
    # 660 — a non-root container (the fix two lines up) can't touch it
    # without being a member of a group whose GID matches the host's
    # `docker` group. Confirmed the hard way: ai-service crashed with
    # `PermissionError(13, 'Permission denied')` from docker-py's
    # from_env() until this was added. Find your host's GID with
    # `getent group docker | cut -d: -f3`; override DOCKER_GID in .env if
    # it isn't 987.
    group_add:
      - "${DOCKER_GID:-987}"
    # devin-server is a Tailscale MagicDNS hostname (docs/11-deployment.md)
    # — Docker's embedded DNS can't reliably resolve it from a container's
    # network namespace (confirmed: intermittently fails even pointed at
    # Tailscale's own resolver), but IS able to route to the IP directly,
    # since traffic goes out through the host, which is itself on the
    # tailnet. Static-map the hostname to that IP rather than depend on
    # DNS forwarding that proved unreliable. If this IP ever changes,
    # either update it here, or just set the Ollama endpoint to the new
    # IP directly in the app's Settings UI — no redeploy needed either way.
    extra_hosts:
      - "devin-server:${DEVIN_SERVER_TAILSCALE_IP}"
    environment:
      AI_SERVICE_DEFAULT_OLLAMA_BASE_URL: ${DEFAULT_OLLAMA_BASE_URL:-http://devin-server:11434}
      AI_SERVICE_STORAGE_ROOT: /app/storage
      # ai-service's own filesystem path (/app/storage) means nothing to
      # the Docker daemon when it launches sandbox containers as siblings
      # (Docker-outside-of-Docker, docs/11-deployment.md) — bind-mount
      # sources are resolved by the daemon against the HOST filesystem,
      # not ai-service's container filesystem. This is how ai-service
      # translates "a file I can see at /app/storage/x" into "the host
      # path the daemon needs to bind-mount that same file for a sibling
      # container." Must be the absolute host path of ./storage below.
      AI_SERVICE_HOST_STORAGE_PATH: ${HOST_STORAGE_PATH}
      AI_SERVICE_SCRAPERS_ROOT: /app/scrapers
      # Same host-path-translation requirement as HOST_STORAGE_PATH above,
      # for the same Docker-outside-of-Docker reason — a scraper run's
      # sandbox container needs its own scraper directory bind-mounted
      # read-write (session files, checkpoints, output), and that mount
      # source has to be a real host path.
      AI_SERVICE_HOST_SCRAPERS_PATH: ${HOST_SCRAPERS_PATH}
    volumes:
      - ./storage:/app/storage
      # Read-write here (unlike web's :ro mount above) — scraper runs
      # persist session state and checkpoint files into their own
      # directory (docs/03), and that happens inside the sandbox
      # container this service launches, not in ai-service itself.
      - ./example-scrapers:/app/scrapers
      # Docker-outside-of-Docker: ai-service launches sandbox containers
      # (spikes/docker-sandbox's pattern) as siblings of itself via the
      # host's own daemon, not nested inside itself — see
      # docs/11-deployment.md's "sandbox-orchestration" section for the
      # real tradeoff this involves.
      - /var/run/docker.sock:/var/run/docker.sock

  # Phase 6 (docs/07-zoom-bot.md) — native Zoom Meeting SDK join + screen
  # share, productionized from spikes/zoom-presentation-bot. Profile-gated
  # (never starts on a plain `docker compose up`): it needs the proprietary
  # SDK bind-mounted, real Zoom credentials, and a meeting to join — none of
  # which the rest of the stack (web/ai-service/scraper testing) needs. Run
  # it explicitly with `docker compose --profile zoom-bot up zoom-bot`.
  zoom-bot:
    profiles: ["zoom-bot"]
    build:
      context: ./apps/zoom-bot-service
    # No `restart: unless-stopped` here unlike the always-on services above
    # — a dropped meeting connection means start.sh's whole boot sequence
    # (fresh Xvfb, fresh Chromium, fresh join) reruns on container restart,
    # which is the v1 "reconnect" strategy documented in join_and_share.cpp;
    # opt into `restart: on-failure` explicitly per-deployment once that
    # tradeoff has actually been exercised against a real dropped call.
    shm_size: "512m"
    environment:
      PRESENT_URL: ${ZOOM_BOT_PRESENT_URL}
      ZOOM_SDK_KEY: ${ZOOM_SDK_KEY}
      ZOOM_SDK_SECRET: ${ZOOM_SDK_SECRET}
      ZOOM_MEETING_NUMBER: ${ZOOM_MEETING_NUMBER}
      ZOOM_MEETING_PASSWORD: ${ZOOM_MEETING_PASSWORD}
      ZOOM_SDK_DIR: /app/zoom-sdk
    volumes:
      # Bind-mounted, not COPYed into the image at build time — see
      # apps/zoom-bot-service/Dockerfile's header comment for why (never
      # redistribute the proprietary SDK inside a built image).
      - ./spikes/zoom-presentation-bot/zoom-sdk:/app/zoom-sdk

volumes:
  postgres-data:
  # ./storage is a bind mount (not a named volume) per docs/11-deployment.md
  # — uploads/attachments need to survive `docker compose down -v` and be
  # directly inspectable/backuppable from the host.
